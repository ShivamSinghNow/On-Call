name: VoiceBridge
options:
  bundleIdPrefix: com.voicebridge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only

targets:
  VoiceBridge:
    type: application
    platform: iOS
    sources:
      - path: VoiceBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicebridge.app
        INFOPLIST_FILE: VoiceBridge/Info.plist
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/Frameworks
    dependencies:
      - framework: Frameworks/cactus-ios.xcframework
        embed: true
